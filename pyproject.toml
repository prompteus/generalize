[project]
name = "generalize"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=4.5.0",
    "lovely-tensors>=0.1.21",
    "safetensors>=0.7.0",
    "tensordict>=0.11.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "transformers>=5.1.0",
    "typer>=0.23.0",
    "wandb>=0.25.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "mypy>=1.19.1",
    "nbformat>=5.10.4",
    "plotly>=6.5.2",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
    "seaborn>=0.13.2",
]

[tool.mypy]
disable_error_code = ["import-untyped"]
files = [
    "generalize",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = [
    "generalize",
]
norecursedirs = [
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache"
]

[tool.ruff]
line-length = 130
