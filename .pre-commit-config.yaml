repos:
  - repo: local
    hooks:
    - id: ruff-format
      name: ruff-format
      entry: ruff
      args: ["format", "--check"]
      language: system
      types: [python]
      stages: [pre-commit]
    - id: ruff-lint
      name: ruff-lint
      entry: ruff
      args: ["check"]
      language: system
      types: [python]
      stages: [pre-commit]
    - id: mypy
      name: mypy
      entry: mypy
      args: ["--check"]
      types: [python]
      language: system
      stages: [pre-commit]
    - id: pytest
      name: pytest
      entry: pytest
      language: system
      pass_filenames: false
      stages: [pre-commit]
